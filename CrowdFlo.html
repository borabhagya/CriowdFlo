<header><h1>Crowd<span>Flo</span></h1><div class="tag">Know the crowd before you board. · MTC city buses, Chennai (synthetic demonstration network)</div></header>
<div class="syn">SYNTHETIC SIMULATION — NOT LIVE MTC DATA</div>
<div class="bar" id="bar"></div><nav id="nav"></nav><main id="app"></main>
<script id="eng">
const T0=360,T1=1320,TE=1440;
const mulb=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hs=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const fm=t=>{t=Math.round(t);return String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const g=(t,m,s)=>Math.exp(-(((t-m)/s)**2));
const prof=(t,c)=>.3+c.am*1.3*g(t,525,70)+c.pm*1.1*g(t,1080,80);
const ST=['Broadway / Parrys','Chennai Central','Egmore','Anna Salai (Spencer)','Thousand Lights','Chetpet','Teynampet','Nandanam','Saidapet','Guindy','Kilpauk','Ashok Nagar'];
const XY=[[50,6],[46,20],[34,33],[64,36],[62,50],[28,50],[56,62],[54,74],[42,84],[56,94],[14,38],[28,72]];
const W=[1.3,1.6,1.2,1.4,.9,.7,1,.8,.8,1.5,.6,.6];
const RT=[{id:'CF-01',col:'#0b6e99',seq:[0,1,2,3,4,6,7,9],seg:[6,5,8,6,7,7,10],hw:10,off:0,base:.5},
{id:'CF-02',col:'#d1495b',seq:[0,3,6,9],seg:[14,12,16],hw:15,off:3,base:.35},
{id:'CF-03',col:'#2e8b57',seq:[1,2,10,5,11,8,9],seg:[5,7,8,9,6,8],hw:12,off:5,base:.4}];
const LN=[];RT.forEach((r,ri)=>[0,1].forEach(d=>{const seq=d?r.seq.slice().reverse():r.seq,seg=d?r.seg.slice().reverse():r.seg,cum=[0];seg.forEach(s=>cum.push(cum.at(-1)+s));LN.push({ri,d,seq,cum,id:r.id+' → '+ST[seq.at(-1)]})}));
const XF=LN.map(L=>L.seq.map(s=>LN.map((M,mi)=>[M,mi]).filter(([M])=>M.ri!=L.ri&&M.seq.indexOf(s)>=0&&M.seq.indexOf(s)<M.seq.length-1)));
const PS={morning:{am:1.3,pm:.8,t:495},evening:{am:.8,pm:1.3,t:1050},off:{am:.2,pm:.2,t:780},event:{am:.8,pm:1,t:1000,surge:{s:3,t0:1020,t1:1110,m:4}},breakdown:{am:1.3,pm:.8,t:480,cancel:[{ri:0,d:0,t0:480,t1:530}]},extra:{am:1.3,pm:.8,t:495,extra:[1,0,0]}};
const preset=k=>{const p=PS[k];return{seed:7,demand:1,hwMult:1,capBase:65,capMult:1,hw:{},extra:p.extra?p.extra.slice():[0,0,0],cancel:p.cancel?JSON.parse(JSON.stringify(p.cancel)):[],cx:[],surge:p.surge?{...p.surge}:null,am:p.am,pm:p.pm}};
function mkTrips(c){const o=[],cap=Math.round(c.capBase*c.capMult);LN.forEach((L,li)=>{const r=RT[L.ri],h=Math.max(3,Math.round((c.hw[L.ri]||r.hw)*c.hwMult)),n=1+c.extra[L.ri];for(let j=0;j<n;j++)for(let t=T0+r.off+(L.d?4:0)+Math.round(h*j/n);t<T1;t+=h){const id=r.id+(L.d?'B':'A')+fm(t)+(j?'x':'');const cx=c.cancel.some(k=>k.ri==L.ri&&k.d==L.d&&t>=k.t0&&t<=k.t1)||c.cx.includes(id);const t0=t+hs(id)%3;o.push({id,li,j,cx,cap,t0,ts:L.cum.map(m=>t0+m),ev:[],ob:[]})}});return o}
function sim(c,seed){const R1=mulb(seed),R2=mulb(seed+99),tr=mkTrips(c),B=Array.from({length:TE+80},()=>[]);
tr.forEach(x=>{if(!x.cx)x.ts.forEach((t,i)=>B[t].push([x,i]))});
const Q=LN.map(L=>L.seq.map(()=>({a:[],h:0,n:0})));let gen=0,tQ=0,tO=0,C=0,ws=0,wn=0,left=0;const wh=Array(61).fill(0),rw=RT.map(()=>[0,0]);
const qs=ST.map(()=>new Int32Array(TE-T0)),ar=new Int32Array(TE-T0),ot=new Int32Array(TE-T0);
for(let t=T0;t<TE;t++){
 if(t<T1)LN.forEach((L,li)=>{const r=RT[L.ri],pr=prof(t,c),bi=((t<780)==(L.d==0))?1.3:.8;L.seq.forEach((s,i)=>{if(i==L.seq.length-1)return;
  let l=r.base*W[s]*pr*bi*c.demand;if(c.surge&&c.surge.s==s&&t>=c.surge.t0&&t<=c.surge.t1)l*=c.surge.m;
  const n=Math.max(0,Math.round(l+(R1()-.5)*2*Math.sqrt(l)));if(!n)return;
  const D=L.seq.slice(i+1),ds=D.reduce((a,d)=>a+W[d],0),al=D.map(d=>Math.floor(n*W[d]/ds));let rm=n-al.reduce((a,b)=>a+b,0);while(rm-->0)al[(R1()*D.length)|0]++;
  const q=Q[li][i];D.forEach((d,k)=>{if(al[k])q.a.push([d,al[k],t])});q.n+=n;gen+=n;tQ+=n;ar[t-T0]+=n})});
 for(const [x,i] of B[t]){const L=LN[x.li],s=L.seq[i],last=i==L.seq.length-1;let al=0,tf=0;const keep=[];
  for(const z of x.ob){if(z[0]==s){al+=z[1];const k=Math.floor(z[1]*.12),cd=XF[x.li][i];if(k&&cd.length){const [M,mi]=cd[(R2()*cd.length)|0],p=M.seq.indexOf(s),D=M.seq.slice(p+1),dd=D[(R2()*D.length)|0];Q[mi][p].a.push([dd,k,t]);Q[mi][p].n+=k;tQ+=k;tf+=k}}else keep.push(z)}
  x.ob=keep;const oa=keep.reduce((a,b)=>a+b[1],0);tO-=al;C+=al-tf;const q=Q[x.li][i],qb=q.n;let bo=0;
  if(!last){bo=Math.min(x.cap-oa,q.n);let nd=bo;while(nd>0){const h=q.a[q.h],k=Math.min(h[1],nd),w=t-h[2];wh[Math.min(60,w)]+=k;ws+=k*w;wn+=k;rw[L.ri][0]+=k*w;rw[L.ri][1]+=k;const e=x.ob.find(z=>z[0]==h[0]);e?e[1]+=k:x.ob.push([h[0],k]);h[1]-=k;nd-=k;if(!h[1])q.h++}q.n-=bo;tQ-=bo;tO+=bo;left+=q.n}
  x.ev[i]={t,al,tf,bo,qb,oa,ob:oa+bo,left:last?0:q.n,pb:qb>0?bo/qb:1}}
 LN.forEach((L,li)=>L.seq.forEach((s,i)=>qs[s][t-T0]+=Q[li][i].n));ot[t-T0]=tO}
const act=tr.filter(x=>!x.cx),evs=[];act.forEach(x=>x.ev.forEach((e,i)=>{if(i<x.ts.length-1)evs.push([x,e,i])}));
const lf=([x,e])=>e.ob/x.cap,mx=act.map(x=>Math.max(...x.ev.map(e=>e.ob/x.cap)));
const st={avgWait:wn?ws/wn:0,maxQ:Math.max(...qs.map(r=>Math.max(...r))),left,avgOcc:evs.length?evs.reduce((a,v)=>a+lf(v),0)/evs.length:0,maxLoad:Math.max(0,...mx),
 exposure:evs.reduce((a,[x,e,i])=>a+(e.ob/x.cap>=.85?e.ob*(LN[x.li].cum[i+1]-LN[x.li].cum[i]):0),0),over:mx.filter(v=>v>=.9).length,trips:act.length,boarded:wn,
 busHours:act.reduce((a,x)=>a+LN[x.li].cum.at(-1)/60,0)};st.cost=st.busHours*1500;
return{c,tr,qs,ar,ot,wh,rw,st,cons:{gen,Q:tQ,O:tO,C},map:new Map(tr.map(x=>[x.id,x]))}}
const full=c=>({act:sim(c,c.seed),ens:[101,102,103,104,105,106,107,108].map(s=>sim(c,s))});
const pst=a=>{a=a.slice().sort((p,q)=>p-q);const n=a.length;return{m:a.reduce((p,q)=>p+q,0)/n,lo:a[Math.floor(n*.1)],hi:a[Math.ceil(n*.9)-1]}};
const PE=(E,x,i,k)=>pst(E.ens.map(e=>e.map.get(x.id).ev[i][k]));
function bpos(x,t){const n=x.ts.length;if(x.cx||t<x.ts[0]||t>x.ts[n-1])return null;let i=0;while(i<n-1&&x.ts[i+1]<=t)i++;return i==n-1?{i:i-1,f:1,ob:0}:{i,f:(t-x.ts[i])/(x.ts[i+1]-x.ts[i]),ob:x.ev[i].ob}}
const crowd=l=>l>=.98?['Full','▉▉▉▉▉','#7a1f2b']:l>=.9?['Near capacity','▉▉▉▉▫','#c2410c']:l>=.7?['High','▉▉▉▫▫','#a16207']:l>=.4?['Moderate','▉▉▫▫▫','#4d7c0f']:['Low','▉▫▫▫▫','#0f766e'];
function plan(E,o,d,dep,pref,tol,wt){const A=E.act,C=[];
 const nx=(li,s,af,n)=>{const p=LN[li].seq.indexOf(s);return A.tr.filter(x=>x.li==li&&!x.cx&&x.ts[p]>=af).sort((a,b)=>a.ts[p]-b.ts[p]).slice(0,n).map(x=>[x,p])};
 const lg=(x,i,j)=>{let ml=0;for(let k=i;k<j;k++)ml=Math.max(ml,PE(E,x,k,'ob').m/x.cap);return{x,i,j,dep:x.ts[i],arr:x.ts[j],oa:PE(E,x,i,'oa'),ob:PE(E,x,i,'ob'),pb:PE(E,x,i,'pb').m,ml}};
 LN.forEach((L,li)=>{const io=L.seq.indexOf(o),id=L.seq.indexOf(d);if(io<0)return;
  if(id>io)nx(li,o,dep,3).forEach(([x,i])=>C.push([lg(x,i,id)]));
  L.seq.forEach((xs,jx)=>{if(jx<=io||xs==d)return;LN.forEach((M,mi)=>{if(M.ri==L.ri)return;const p=M.seq.indexOf(xs),q=M.seq.indexOf(d);if(p<0||q<=p)return;nx(li,o,dep,2).forEach(([x,i])=>nx(mi,xs,x.ts[jx]+2,1).forEach(([y,k])=>C.push([lg(x,i,jx),lg(y,k,q)])))})})});
 let M=C.map(l=>({l,arr:l.at(-1).arr,dur:l.at(-1).arr-dep,wait:l[0].dep-dep+(l[1]?l[1].dep-l[0].arr:0),P:l.reduce((a,b)=>a*b.pb,1),ml:Math.max(...l.map(z=>z.ml)),tr:l.length-1}));
 if(!M.length)return{M:[]};const ea=Math.min(...M.map(m=>m.arr)),w0=Math.min(...M.map(m=>m.wait));
 M.forEach(m=>{const pen=(m.ml>tol?1e3:0)+(m.wait-w0>wt?1e3:0);m.sc=pen+({ear:m.arr,low:m.ml*1e3+m.arr,rel:(1-m.P)*1e3+m.arr,bal:m.arr+40*m.ml+60*(1-m.P)}[pref])});
 M.sort((a,b)=>a.sc-b.sc);const seen=new Set();M=M.filter(m=>{const k=m.l.map(z=>z.x.id).join('>');return seen.has(k)?0:seen.add(k)}).slice(0,4);
 return{M,ear:M.slice().sort((a,b)=>a.arr-b.arr)[0]}}
</script>
<script id="tst">
const TESTS=[];const tt=(n,f)=>TESTS.push([n,f]);const ok=(c,m)=>{if(!c)throw new Error(m||'assert')};
const B0=()=>preset('morning'),r0=()=>sim(B0(),7);
tt('Passenger conservation (gen = queued+onboard+completed)',()=>{const r=r0();ok(r.cons.gen==r.cons.Q+r.cons.O+r.cons.C,JSON.stringify(r.cons));ok(r.cons.O==0,'onboard at end')});
tt('Capacity, boarding & alighting consistency',()=>{const r=r0();for(const x of r.tr)for(const e of x.ev){if(!e)continue;ok(e.ob<=x.cap&&e.bo<=x.cap-e.oa&&e.oa>=0&&e.al>=0&&e.bo>=0)}});
tt('Queues never negative',()=>{ok(r0().qs.every(a=>a.every(v=>v>=0)))});
tt('Route sequence validity',()=>{RT.forEach(r=>{ok(new Set(r.seq).size==r.seq.length&&r.seg.length==r.seq.length-1&&r.seg.every(s=>s>0))});ok(RT.every(r=>r.seq.every(s=>s<ST.length)));[0,1,2,3,9].forEach(a=>ok(a<ST.length))});
tt('Vehicle movement monotonic',()=>{r0().tr.forEach(x=>x.ts.forEach((t,i)=>ok(i==0||t>x.ts[i-1])))});
tt('Transfer feasibility (Kilpauk→Anna Salai)',()=>{const E=full(B0()),p=plan(E,10,3,495,'ear',1,60);const t=p.M.find(m=>m.tr==1);ok(t&&t.l[0].arr+2<=t.l[1].dep&&t.l[0].x.li!=t.l[1].x.li)});
tt('Journey recommendations (Broadway→Guindy 08:15)',()=>{const E=full(B0()),p=plan(E,0,9,495,'bal',.9,10);ok(p.M.length>=2);p.M.forEach(m=>{ok(m.l.at(-1).j>m.l[0].i||m.tr==1);ok(m.P>=0&&m.P<=1)})});
tt('Cancellation removes trips and raises downstream load',()=>{const c=preset('breakdown'),a=sim(c,7),b=r0();ok(a.tr.some(x=>x.cx)&&a.tr.filter(x=>x.cx).every(x=>x.ev.length==0));ok(a.st.maxQ>=b.st.maxQ)});
tt('Demand surge raises stop queue',()=>{const a=sim(preset('event'),7),b=sim({...preset('event'),surge:null},7);ok(Math.max(...a.qs[3])>Math.max(...b.qs[3]))});
tt('Deterministic replay',()=>{ok(JSON.stringify(sim(B0(),7).st)==JSON.stringify(sim(B0(),7).st))});
tt('Reset restores baseline',()=>{const c=B0();c.demand=2;c.cx.push('x');ok(JSON.stringify(preset('morning'))==JSON.stringify(B0()))});
tt('Additional bus adds fleet; identical demand',()=>{const a=r0(),b=sim(preset('extra'),7);ok(b.st.trips>a.st.trips&&a.cons.gen==b.cons.gen)});
tt('Baseline vs intervention (not assumed better everywhere)',()=>{const a=r0(),b=sim(preset('extra'),7);ok(b.st.busHours>a.st.busHours&&b.st.avgWait<=a.st.avgWait+1e-9)});
function runTests(){return TESTS.map(([n,f])=>{try{f();return[n,1,'']}catch(e){return[n,0,e.message]}})}
</script>
<script>
const $=s=>document.querySelector(s),pc=v=>Math.round(v*100)+'%',r1=v=>Math.round(v*10)/10;
let S={tab:'plan',t:495,play:0,sp:5,sc:'morning',cfg:preset('morning'),sel:3,bus:null,pl:{o:0,d:9,dep:495,pref:'bal',tol:.9,wt:10},hl:[],iv:{ri:0,mode:'bus',v:1},ln:0},CK='',CV=null,IK='',IV=null,TM=null;
const E=()=>{const k=JSON.stringify(S.cfg);if(k!=CK){CK=k;CV=full(S.cfg)}return CV};
const tag=l=>{const c=crowd(l);return`<span class=tg style="background:${c[2]}" title="Load factor ${pc(l)}">${c[1]} ${c[0]}</span>`};
const opts=(a,v)=>a.map((x,i)=>`<option value=${Array.isArray(x)?x[0]:i} ${(Array.isArray(x)?x[0]:i)==v?'selected':''}>${Array.isArray(x)?x[1]:x}</option>`).join('');
const stopOpts=v=>opts(ST.map((s,i)=>[i,s]),v);
function LC(se,o){const w=560,h=o.h||165,p=30,ym=Math.max(1,...se.flatMap(s=>s.p.map(a=>a[1]).concat((s.b||[]).map(a=>a[2]))))*1.08,X=x=>p+(x-o.x0)/(o.x1-o.x0)*(w-p-6),Y=y=>h-16-y/ym*(h-28);
let s=`<svg viewBox="0 0 ${w} ${h}" class=ch role=img aria-label="${o.t}">`;
[0,.5,1].forEach(f=>s+=`<line x1=${p} x2=${w-6} y1=${Y(ym*f)} y2=${Y(ym*f)} class=gl /><text x=${p-3} y=${Y(ym*f)+3} class=ax text-anchor=end>${Math.round(ym*f)}</text>`);
for(let k=0;k<=4;k++){const v=o.x0+(o.x1-o.x0)*k/4;s+=`<text x=${X(v)} y=${h-3} class=ax text-anchor=middle>${fm(v)}</text>`}
se.forEach((a,k)=>{if(a.b&&a.b.length)s+=`<path d="M${a.b.map(q=>X(q[0])+','+Y(q[2])).join('L')}L${a.b.slice().reverse().map(q=>X(q[0])+','+Y(q[1])).join('L')}Z" fill="${a.c}" opacity=.2 />`;
 s+=`<polyline fill=none stroke="${a.c}" stroke-width=2 ${a.d?'stroke-dasharray="5 3"':''} points="${a.p.map(q=>X(q[0])+','+Y(q[1])).join(' ')}"/>`;a.p.forEach((q,j)=>{if(j%3==0)s+=`<circle cx=${X(q[0])} cy=${Y(q[1])} r=5 fill=transparent><title>${a.n} ${fm(q[0])}: ${r1(q[1])} ${o.u}</title></circle>`});s+=`<text x=${p+6+k*125} y=10 fill="${a.c}" class=ax>■ ${a.n}</text>`});
if(o.now>=o.x0&&o.now<=o.x1)s+=`<line x1=${X(o.now)} x2=${X(o.now)} y1=12 y2=${h-16} stroke="#d97706" stroke-dasharray="3 3"/>`;
return s+`<text x=${w-4} y=10 class=ax text-anchor=end>${o.u}</text></svg>`}
const bars=(a,u)=>{const m=Math.max(1e-9,...a.map(x=>x.v));return a.map(x=>`<div title="${x.l}: ${r1(x.v)} ${u}" style="display:flex;gap:6px;align-items:center;margin:2px 0"><span style="width:130px;font-size:12px">${x.l}</span><div class=bb style="width:${x.v/m*60}%;background:${x.c||'var(--ac)'}"></div><b style="font-size:12px">${r1(x.v)} ${u}</b></div>`).join('')};
function nextArr(e,s,t,n){const out=[];LN.forEach((L,li)=>{const p=L.seq.indexOf(s);if(p<0||p==L.seq.length-1)return;e.act.tr.filter(x=>x.li==li&&!x.cx&&x.ts[p]>=t).sort((a,b)=>a.ts[p]-b.ts[p]).slice(0,n).forEach(x=>out.push([x,p]))});return out.sort((a,b)=>a[0].ts[a[1]]-b[0].ts[b[1]])}

me(){return`<div class=c><h3>Methods, assumptions and limitations</h3><ol>
<li><b>Why MTC buses / central Chennai:</b> city buses carry most public-transport trips and crowding is visible to riders; the five anchors (Broadway/Parrys, Chennai Central, Egmore, Anna Salai, Guindy) form a dense interchange corridor.</li>
<li><b>Network:</b> three synthetic routes (CF-01 trunk, CF-02 limited-stop, CF-03 cross-link), 12 stops, both directions, transfer nodes where routes share stops. Not official MTC routes, stop lists or timetables. The map is schematic.</li>
<li><b>Demand:</b> per stop-line per minute λ = route base × stop weight × time-of-day profile (AM peak 08:45, PM peak 18:00) × direction bias × scenario × surge; arrivals = round(λ ± √λ noise) from a seeded RNG; destinations split by stop weights downstream.</li>
<li><b>Boarding/alighting:</b> discrete-time (1 min). Alight at destination (12% transfer to another route at shared stops → transfer arrivals); board FIFO up to capacity; the rest stay queued. Onboard_next = Onboard − Alight + Board; Board ≤ Capacity − Onboard; Queue_next = Queue + Arrivals + Transfers − Board.</li>
<li><b>Load factor</b> = onboard / capacity (default 65, an assumption). Low &lt;40%, Moderate 40–70%, High 70–90%, Near capacity 90–98%, Full ≥98%; shown with colour, bars and text.</li>
<li><b>Forecast:</b> Monte-Carlo ensemble of 8 seeded runs of the same demand model; mean and p10–p90 are shown. It is not a trained ML model and is not conditioned on live observations. “Simulated” is one seed (7), so forecast vs simulated differences reflect demand variability only.</li>
<li><b>Boarding probability:</b> ensemble mean of boarded ÷ queue present when the bus departs the stop (FIFO approximation); multi-leg = product. Model-estimated, not validated.</li>
<li><b>Interventions:</b> re-run with identical seed/demand. Cost uses an illustrative ₹1,500 per bus-hour. Not every metric improves.</li>
<li><b>Limits:</b> no traffic model (only 0–2 min per-trip jitter and cancellations), no platform capacity, fixed 12% transfer rate, no passenger route choice, no fares, no real data.</li>
<li><b>For real deployment:</b> GTFS static (if published), GTFS-Realtime / vehicle GPS, automatic passenger counters, ticketing (ETM) records, manual boarding/alighting counts to calibrate and validate. <b>None of these are connected here.</b></li></ol></div>`},

function stopPanel(e){const s=S.sel,t=S.t,q=qAt(e.act,s,t),f1=qF(e,s,t+15),f2=qF(e,s,t+30);return`<div class=c><h3>${ST[s]}</h3>Routes: ${RT.filter(r=>r.seq.includes(s)).map(r=>r.id).join(', ')}<br>Queue now: <b>${q}</b> ${tag(Math.min(1,q/60))} (stop crowding = queue/60)<br>Forecast +15 min: ${Math.round(f1.m)} (${f1.lo}–${f1.hi}), +30 min: ${Math.round(f2.m)} (${f2.lo}–${f2.hi})<table><tr><th>Next bus</th><th>Time</th><th>Pred. load</th><th>P(board)</th></tr>${nextArr(e,s,t,2).map(([x,p])=>`<tr><td>${x.id}</td><td>${fm(x.ts[p])}</td><td>${tag(PE(e,x,p,'ob').m/x.cap)}</td><td>${pc(PE(e,x,p,'pb').m)}</td></tr>`).join('')}</table></div>`}
function busPanel(e){const x=e.act.map.get(S.bus);if(!x)return'';const b=bpos(x,S.t),L=LN[x.li];return`<div class=c><h3>Bus ${x.id}</h3>${L.id}${x.cx?' · CANCELLED':''}<br>${b?`Between ${ST[L.seq[b.i]]} and <b>${ST[L.seq[b.i+1]]}</b><br>Onboard ${b.ob}/${x.cap} ${tag(b.ob/x.cap)}`:'Not currently running'}<table><tr><th>Stop</th><th>Time</th><th>Predicted onboard (p10–p90)</th></tr>${x.cx?'':L.seq.slice(0,-1).map((s,i)=>{const p=PE(e,x,i,'ob');return`<tr><td>${ST[s]}</td><td>${fm(x.ts[i])}</td><td>${Math.round(p.m)}/${x.cap} (${p.lo}–${p.hi})</td></tr>`}).join('')}</table></div>`}
const X={draw(){bar();$('#app').innerHTML=V[S.tab]()},
pp(){S.play=!S.play;clearInterval(TM);if(S.play)TM=setInterval(()=>{S.t+=S.sp;if(S.t>=T1){S.t=T1;S.play=0;clearInterval(TM)}X.draw()},700);X.draw()},
step(){S.t=Math.min(T1,S.t+5);X.draw()},sc(k){S.sc=k;S.cfg=preset(k);S.t=PS[k].t;S.pl.dep=S.t;X.draw()},reset(){X.sc(S.sc)},
cf(k,v){S.cfg[k]=v;X.draw()},dep(v){const[h,m]=v.split(':');S.pl.dep=+h*60+ +m;X.draw()},
surge(){S.cfg.surge={s:+$('#ss').value,t0:S.t,t1:S.t+90,m:4};X.draw()},
cancel(){const li=+$('#cl').value;E().act.tr.filter(x=>x.li==li&&!x.cx&&x.ts[0]>=S.t).sort((a,b)=>a.ts[0]-b.ts[0]).slice(0,3).forEach(x=>S.cfg.cx.push(x.id));X.draw()},
add(){S.cfg.extra[+$('#ab').value]++;X.draw()}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a=='stop')S.sel=+a.dataset.v;else S.bus=a.dataset.v;X.draw()});
X.draw();
</script></body></html>
